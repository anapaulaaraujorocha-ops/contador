<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F6E5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Contador">
<meta name="description" content="Contador de calorias, proteínas, carboidratos e gorduras por refeição, com a tabela TACO.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F6E5C'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='white' stroke-width='3.5' stroke-dasharray='40 60' transform='rotate(-90 16 16)'/%3E%3C/svg%3E">
<title>Contador de Calorias</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: app shell; top bar + tabs on desktop, bottom nav on phone; "Hoje" splits into summary column + meals column on wide screens */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E7EDE9; --ink:#14231C; --muted:#5A6B62; --line:#D4DDD8;
  --accent:#0F6E5C; --accent-ink:#FFFFFF; --accent-soft:#D5EBE4;
  --prot:#3558D4; --carb:#B97D0C; --fat:#B83A70;
  --ok:#1C8048; --ok-soft:#D9F0E2; --over:#C0412A; --over-soft:#F8E0DA;
  --shadow:0 1px 2px rgba(20,35,28,.06),0 4px 16px rgba(20,35,28,.06);
  --f-display:"Sora",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Nunito Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  --tint-1:#F6E7D6; --tint-2:#FBE0DC; --tint-3:#DCEFE6; --tint-4:#F7EDC9; --tint-5:#F3DFD0; --tint-6:#E3E6F7; --tint-7:#F8DDE9;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1B; --surface-2:#1F2A25; --ink:#E5EEE9; --muted:#93A49B; --line:#2A3731;
  --accent:#43C49C; --accent-ink:#06261D; --accent-soft:#183A30;
  --prot:#829DFF; --carb:#EDB747; --fat:#F07FAE;
  --ok:#5AD08A; --ok-soft:#173426; --over:#FF8569; --over-soft:#3A1E18;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  --tint-1:#3A2E22; --tint-2:#3D2724; --tint-3:#1E3A2F; --tint-4:#3A3420; --tint-5:#3B2B21; --tint-6:#272B44; --tint-7:#3E2433;
}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1B; --surface-2:#1F2A25; --ink:#E5EEE9; --muted:#93A49B; --line:#2A3731;
  --accent:#43C49C; --accent-ink:#06261D; --accent-soft:#183A30;
  --prot:#829DFF; --carb:#EDB747; --fat:#F07FAE;
  --ok:#5AD08A; --ok-soft:#173426; --over:#FF8569; --over-soft:#3A1E18;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  --tint-1:#3A2E22; --tint-2:#3D2724; --tint-3:#1E3A2F; --tint-4:#3A3420; --tint-5:#3B2B21; --tint-6:#272B44; --tint-7:#3E2433;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);display:grid;place-items:center}
.brand-mark{font-size:16px;line-height:1}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.tab .emo{margin-right:6px;font-size:15px}
.meal-emo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex:none;background:var(--m,var(--surface-2))}
.m-cafe{--m:var(--tint-1)} .m-lanche_manha{--m:var(--tint-2)} .m-almoco{--m:var(--tint-3)} .m-lanche_tarde{--m:var(--tint-4)} .m-jantar{--m:var(--tint-5)} .m-ceia{--m:var(--tint-6)} .m-sobremesa{--m:var(--tint-7)}
.food-emo{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:18px;flex:none;line-height:1}
.food-emo.big{width:44px;height:44px;font-size:24px}
.meal-empty{margin:0;padding:0 14px 2px 62px;color:var(--muted);font-size:13.5px}
.macro-name .emo{font-size:16px}
.tabs{display:flex;gap:4px;margin-left:12px}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:700}
.tab[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
.sync{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid transparent;background:none;padding:4px 8px;border-radius:99px}
.sync:hover{border-color:var(--line);background:var(--surface)}
.sync img{width:22px;height:22px;border-radius:50%}
.login{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;padding:24px 16px;overflow-y:auto}
.login-card{max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.login-emo{font-size:40px;letter-spacing:6px}
.login h1{font-size:30px}
.login p{margin:0;color:var(--muted)}
.btn.google{width:100%;padding:13px 16px;font-size:16px;background:var(--surface);gap:10px;margin-top:10px}
.login-note{font-size:13.5px}
.login-err{color:var(--over)!important;font-size:14px}
.acct{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.acct img{width:44px;height:44px;border-radius:50%}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)}
.sync.local i{background:var(--carb)}

main{max-width:1080px;margin:0 auto;padding:16px 16px 110px}
.bottom{display:none}
@media (max-width:760px){
  .tabs{display:none}
  .bottom .tab .emo{font-size:22px;margin:0;filter:grayscale(1);opacity:.6}
  .bottom .tab[aria-current="page"] .emo{filter:none;opacity:1}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;padding:6px 2px}
  .bottom .tab svg{width:22px;height:22px}
  .bottom .tab[aria-current="page"]{background:transparent;color:var(--accent)}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{color:var(--over)}
.btn.small{padding:6px 10px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:0;background:transparent;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

/* date bar */
.datebar{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.datebar .when{flex:1;min-width:0;text-align:center;position:relative}
.datebar .when strong{font-family:var(--f-display);font-size:18px;display:block}
.datebar .when span{font-size:13px;color:var(--muted)}
 .daypick{display:flex;gap:6px;margin:-4px 0 14px;flex-wrap:wrap}
.daypick button,.daypick .other{flex:1 1 0;min-width:76px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 6px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:14px;position:relative;color:var(--ink)}
.daypick small{font-weight:600;font-size:11.5px;color:var(--muted)}
.daypick button[aria-pressed="true"],.daypick .other.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daypick button[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}
.daypick .other{justify-content:center;cursor:pointer}
.daypick .other input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.pastnote{padding:10px 14px;border-radius:12px;background:var(--accent-soft);font-size:14px;margin-bottom:14px}
.pastnote button{border:0;background:none;color:var(--accent);font-weight:800;text-decoration:underline;padding:0}
.datebar input[type=date]{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}

.today-grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;align-items:start}
.today-grid>.summary{position:sticky;top:76px}
@media (max-width:860px){.today-grid{grid-template-columns:minmax(0,1fr)}.today-grid>.summary{position:static}}

.summary{padding:18px}
.kcal-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kcal-big{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1}
.kcal-goal{color:var(--muted);font-weight:600}
.bar{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;position:relative}
.bar>b{display:block;height:100%;border-radius:6px;background:var(--accent);max-width:100%}
.bar.over>b{background:var(--over)}
.bar.thin{height:7px}
.chip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.over{background:var(--over-soft);color:var(--over)}
.macros{display:grid;gap:12px;margin-top:16px}
.macro-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
.macro-name{font-weight:700;display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.macro-val{font-weight:700}
.macro-val small{color:var(--muted);font-weight:600;font-size:13px}
.p-c{--c:var(--prot)} .c-c{--c:var(--carb)} .f-c{--c:var(--fat)}
.dot{background:var(--c)}
.macros .bar>b{background:var(--c)}
.macros .bar.over>b{background:var(--over)}
.empty-goal{margin-top:14px;padding:12px;border-radius:10px;background:var(--accent-soft);font-size:14px}
.empty-goal button{border:0;background:none;color:var(--accent);font-weight:700;padding:0;text-decoration:underline}

.meals{display:grid;gap:12px}
.meal{padding:4px 0}
.meal-head{display:flex;align-items:center;gap:10px;padding:10px 14px 8px}
.meal-head h3{font-size:16px;font-weight:600;flex:1;min-width:0}
.meal-kcal{font-weight:700;white-space:nowrap}
.meal-kcal small{color:var(--muted);font-weight:600}
.meal-sub{padding:0 14px 8px;display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--muted)}
.meal-sub span{display:inline-flex;align-items:center;gap:5px}
.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:8px;padding:9px 6px 9px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item-main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.item-name{font-weight:600;overflow-wrap:anywhere}
.item-meta{font-size:12.5px;color:var(--muted)}
.item-kcal{font-weight:700;white-space:nowrap}
.meal-actions{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px 6px}

/* history */
.hist-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;white-space:nowrap;border-radius:8px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{padding:12px 14px}
.stat .v{font-family:var(--f-display);font-size:22px;font-weight:700;margin-top:2px}
.stat .g{font-size:13px;color:var(--muted)}
.chart-card{padding:14px;margin-bottom:14px}
.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block;width:100%;min-width:320px;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.day-list{list-style:none;margin:0;padding:0}
.day-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.day-list li:last-child .day-row{border-bottom:0}
.day-row:hover{background:var(--surface-2)}
.day-date{font-weight:700}
.day-macros{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.day-macros span{display:inline-flex;align-items:center;gap:5px}
.day-right{display:flex;align-items:center;gap:8px;font-weight:700}

/* diet & forms */
.section{padding:16px;margin-bottom:14px}
.section h2{font-size:17px;margin-bottom:4px}
.section p.hint{margin:0 0 12px;color:var(--muted);font-size:14px}
.goal-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.goal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.input{width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-width:0}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.unit-in{position:relative}
.unit-in .input{padding-right:40px}
.unit-in em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:13px;pointer-events:none}
.split{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:13.5px}
.mg-table-wrap{overflow-x:auto}
.mg-table{border-collapse:collapse;width:100%;min-width:520px}
.mg-table th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 6px;font-weight:700}
.mg-table td{padding:5px 6px;border-top:1px solid var(--line)}
.mg-table td:first-child{font-weight:600;white-space:nowrap}
.mg-table .input{padding:7px 8px}
.mg-table tfoot td{font-weight:700}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.food-list{list-style:none;margin:0;padding:0}
.food-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.food-list li:last-child .food-row{border-bottom:0}
.food-row .grow{flex:1;min-width:0}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(10,20,16,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:761px){.sheet-wrap{align-items:center}.sheet{border-radius:18px;max-height:86%}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px 14px 8px 18px}
.sheet-head h2{font-size:17px;flex:1;min-width:0}
.sheet-body{padding:4px 18px 18px;overflow-y:auto;min-height:0}
.sheet .seg{margin-bottom:12px}
.result-list{list-style:none;margin:8px 0 0;padding:0}
.result{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:10px 4px;border-bottom:1px solid var(--line)}
.result:hover{background:var(--surface-2)}
.result .grow{flex:1;min-width:0}
.result .nm{font-weight:600}
.result .mt{font-size:12.5px;color:var(--muted)}
.src{font-size:10.5px;font-weight:800;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-right:2px}
.tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.portions{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.portions button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:13.5px;font-weight:600}
.portions button:hover{border-color:var(--accent)}
.preview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:14px 0;text-align:center}
.preview div{background:var(--surface-2);border-radius:10px;padding:8px 4px}
.preview b{display:block;font-family:var(--f-display);font-size:17px}
.preview span{font-size:12px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin:10px 0}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form-grid .full{grid-column:1/-1}
.sel-food{padding:12px;border-radius:12px;background:var(--surface-2);margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.sel-food .grow{flex:1;min-width:0}
.sheet .seg{display:flex;width:100%}
.sheet .seg button{flex:1;padding:7px 4px;font-size:13.5px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;font-size:13.5px;font-weight:600;color:var(--ink)}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.calc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0}
.calc-grid .full{grid-column:1/-1}
.adj{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:6px 0 10px}
.adj summary{font-weight:700;font-size:14px;cursor:pointer}
.calc-out{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:8px 0}
.calc-out b{font-family:var(--f-display)}
.calc-out .brk{color:var(--muted);font-size:12.5px;margin-top:4px}
.ing-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.ing-row .grow{flex:1;min-width:0;font-size:14px}
.ing-row .grow small{display:block;color:var(--muted);font-size:12px}
.ing-row .unit-in{width:104px;flex:none}.ing-row input{width:100%}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.back-link{border:0;background:none;color:var(--accent);font-weight:700;padding:0 0 10px;font-size:14px}
.habit{margin:4px 0 6px}.habit p{margin:0 0 2px;font-size:13.5px;color:var(--muted);font-weight:600}
.hint.fast{margin:4px 0 6px;color:var(--ok);font-weight:700}
.more-opts{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}

// Cálculo de preparo, por 100 g do alimento CRU: rend = peso pronto / peso cru (%), oleo = g de óleo absorvido, emp = g de cada ingrediente do empanamento.
const ING={rosca:["Farinha de rosca",371,11.4,75.8,1.5],ovo:["Ovo",143,13,1.6,8.9],trigo:["Farinha de trigo",360,9.8,75.1,1.4]};
const PREP=[
  {k:"grelhado",nm:"Grelhado ou assado",emo:"🔥",rend:75,oleo:0,emp:{},m:"grelhado",f:"grelhada"},
  {k:"azeite",nm:"Grelhado com fio de óleo",emo:"🫒",rend:75,oleo:3,emp:{},m:"grelhado com óleo",f:"grelhada com óleo"},
  {k:"cozido",nm:"Cozido ou ensopado",emo:"🍲",rend:80,oleo:0,emp:{},m:"cozido",f:"cozida"},
  {k:"refogado",nm:"Refogado",emo:"🥘",rend:80,oleo:4,emp:{},m:"refogado",f:"refogada"},
  {k:"frito",nm:"Frito sem empanar",emo:"🍳",rend:70,oleo:8,emp:{},m:"frito",f:"frita"},
  {k:"farinha",nm:"Frito na farinha de trigo",emo:"🌾",rend:70,oleo:8,emp:{trigo:4},m:"frito na farinha de trigo",f:"frita na farinha de trigo"},
  {k:"empanado",nm:"Empanado e frito (milanesa)",emo:"🍤",rend:80,oleo:12,emp:{rosca:8,ovo:5,trigo:2},m:"empanado e frito",f:"empanada e frita"},
  {k:"airfryer",nm:"Empanado na air fryer ou forno",emo:"💨",rend:80,oleo:2,emp:{rosca:8,ovo:5,trigo:2},m:"empanado na air fryer",f:"empanada na air fryer"},
  {k:"imersao",nm:"Batata ou legume frito",emo:"🍟",rend:40,oleo:6,emp:{},m:"frito",f:"frita"}
];
function cookCalc(b,o){
  const t={kcal:b.kcal,p:b.p,c:b.c,f:b.f},parts=[]; let empG=0;
  Object.keys(ING).forEach(k=>{const g=+(o.emp||{})[k]||0;if(!g)return;const v=ING[k];empG+=g;t.kcal+=v[1]*g/100;t.p+=v[2]*g/100;t.c+=v[3]*g/100;t.f+=v[4]*g/100;parts.push([v[0],g,v[1]*g/100])});
  const ol=+o.oleo||0; if(ol){t.kcal+=ol*8.84;t.f+=ol;parts.push(["Óleo absorvido",ol,ol*8.84])}
  const peso=Math.max(1,(100+empG)*(o.rend||100)/100+ol), k=100/peso;
  return {kcal:t.kcal*k,p:t.p*k,c:t.c*k,f:t.f*k,peso,parts,total:t.kcal};
}
const prepBaseName=n=>n.replace(/,\s*(congelad|fresc)[oa]s?\b/gi,"").replace(/,\s*cru[as]{0,2}\s*$/i,"").trim();
const isFem=n=>/\bcruas?\s*$/i.test(n.trim());
const prepName=(n,m)=>prepBaseName(n)+", "+(isFem(n)?m.f:m.m);
// versões prontas geradas pela mesma conta da calculadora
const CALC_FOODS=(()=>{
  const raw=TACO_FOODS.concat(USDA_FOODS).filter(f=>/\bcru[as]{0,2}$/.test(norm(f.name))), have=COMMON.concat(TACO_FOODS,USDA_FOODS).map(f=>norm(f.name)), out=[];
  const plan=[
    [/^(abadejo|atum, fresco|cacao|corvina|merluza|pescada|pescadinha|pintado|salmao|sardinha|tucunare|tilapia|camarao)/,["empanado","airfryer","farinha","grelhado"]],
    [/^frango, (peito|coxa|sobrecoxa), sem pele/,["empanado","airfryer","farinha","grelhado"]],
    [/^carne, bovina, (patinho|coxao mole|contra-file, sem|miolo de alcatra|file mingnon)/,["empanado","airfryer"]],
    [/^porco, (lombo|bisteca)/,["empanado","airfryer","grelhado"]],
    [/^(berinjela|abobrinha|couve-flor)/,["empanado","airfryer"]]
  ];
  const clash={grelhado:/grelhad|assad/,farinha:/farinha.*frit/,empanado:/empanad|milanesa/,airfryer:/air fryer/,imersao:/frit/};
  raw.forEach(b=>{const nb=norm(b.name);plan.forEach(([re,ms])=>{if(!re.test(nb))return;ms.forEach(k=>{
    const m=PREP.find(x=>x.k===k), base=norm(prepBaseName(b.name));
    if(have.some(h=>h.startsWith(base)&&clash[k].test(h.slice(base.length))))return;
    const r=cookCalc(b,m);
    out.push({id:"cx"+out.length,name:prepName(b.name,m),kcal:Math.round(r.kcal),p:Math.round(r.p*10)/10,c:Math.round(r.c*10)/10,f:Math.round(r.f*10)/10,unit:"g",per:100,portions:[],builtin:true,src:"Calc",cat:b.cat,from:b.name,method:k});
  })})});
  return out;
})();
const BASE=COMMON.concat(TACO_FOODS,USDA_FOODS,CALC_FOODS);

let col=null, syncMode="connecting";
const writers={};
function queueWrite(id,body){
  const w=writers[id]||(writers[id]={busy:false,next:null});
  w.next=body; if(!w.busy) flush(id);
}
async function flush(id){
  const w=writers[id]; w.busy=true;
  while(w.next){
    const b=w.next; w.next=null;
    try{ await col.doc(id).set(b); }
    catch(e){
      if(e&&e.code==="unavailable"){
        await new Promise(r=>setTimeout(r,700+Math.random()*900));
        try{await col.doc(id).set(b)}catch(e2){writeFailed(e2)}
      } else writeFailed(e);
    }
  }
  w.busy=false;
}
function writeFailed(e){
  if(e&&e.code==="quota_exceeded") toast("O espaço de armazenamento acabou. Apague dias antigos para continuar salvando.");
  else toast("Não foi possível sincronizar agora. Seus dados continuam salvos neste aparelho.");
}
function dayDoc(date){const d=S.days[date];return {type:"day",date,items:d?d.items:[]}}

  return firebase.firestore().collection("config").doc("ia").set({key:k,por:currentUser.email||"",em:Date.now()}).then(()=>{appAiKey=k;return true}).catch(()=>false);
}
function maybePublishKey(){if(appKeyLoaded&&!appAiKey&&!appKeyTried&&S.settings.aiKey){appKeyTried=true;publishAppKey(S.settings.aiKey.trim()).then(ok=>{if(ok)toast("Chave da IA liberada para todos os usuários")})}}
function guestMode(){try{return localStorage.getItem("contador.guest")==="1"}catch(e){return false}}
function showLogin(msg){$("#login").hidden=false;const e=$("#loginErr");e.hidden=!msg;e.textContent=msg||""}
function hideLogin(){$("#login").hidden=true}
function resetState(){S={settings:defaultSettings(),days:{}}}
function startLocal(){
  if(unsubSnap){unsubSnap();unsubSnap=null}
  col=null;currentUser=null;LS_KEY=ANON_KEY;resetState();lsLoad();setSync("local");
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  render();
}
function startUser(user){
  setTimeout(loadShared,0);
  currentUser=user;
  if(unsubSnap){unsubSnap();unsubSnap=null}
  LS_KEY="contador.v1.u."+user.uid;resetState();lsLoad();
  // primeira vez nesta conta neste aparelho: traz o que estava salvo sem login
  let migrating=false;
  if(!hasLocalData()){try{const r=localStorage.getItem(ANON_KEY);if(r){const o=JSON.parse(r);S.settings=Object.assign(defaultSettings(),o.settings||{});S.days=o.days||{};migrating=hasLocalData()}}catch(e){}}
  try{localStorage.setItem("contador.lastUid",user.uid)}catch(e){}
  hideLogin();setSync("connecting");render();
  loadAppKey();
  col=firebase.firestore().collection("users").doc(user.uid).collection("dados");
  let ready=false;
  unsubSnap=col.onSnapshot({includeMetadataChanges:false},snap=>{
    if(!ready){
      if(snap.metadata.fromCache&&snap.empty) return;
      ready=true;
      if(snap.empty){
        if(hasLocalData()){
          Object.keys(S.days).forEach(k=>{if(S.days[k].items&&S.days[k].items.length)queueWrite("d-"+k,dayDoc(k))});
          queueWrite("settings",Object.assign({type:"settings"},S.settings));
          if(migrating){try{localStorage.removeItem(ANON_KEY)}catch(e){}toast("Seus registros deste aparelho foram para a sua conta")}
        }
        lsSave();setSync("on");render();return;
      }
    }
    const days={};let settings=null;
    snap.docs.forEach(doc=>{
      const d=doc.data(); if(!d) return;
      if(doc.id==="settings") settings=d;
      else if(d.type==="day"&&d.date) days[d.date]={items:Array.isArray(d.items)?d.items:[]};
    });
    Object.keys(writers).forEach(wid=>{
      if(!writers[wid].next) return;
      if(wid==="settings") settings=S.settings;
      else{const k=wid.slice(2); if(S.days[k]) days[k]=S.days[k];}
    });
    if(settings){const st=Object.assign(defaultSettings(),settings);delete st.type;S.settings=st}
    S.days=days; lsSave(); setSync(snap.metadata.fromCache?"connecting":"on"); render(); maybePublishKey();
  },err=>{unsubSnap=null;col=null;setSync("local");toast("Não foi possível acessar sua conta agora. Os dados continuam salvos neste aparelho.");render()});
}
async function initSync(){
  if(!FIREBASE_CONFIG){startLocal();return}
  if(!(window.firebase&&firebase.initializeApp)){
    // sem internet para carregar o login: usa a última conta salva neste aparelho
    let last=null;try{last=localStorage.getItem("contador.lastUid")}catch(e){}
    if(last){LS_KEY="contador.v1.u."+last;resetState();lsLoad();setSync("local");render();toast("Sem conexão: mostrando os dados salvos neste aparelho")}
    else startLocal();
    return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  try{firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  fbReady=true;
  firebase.auth().getRedirectResult().catch(e=>showLogin(loginError(e)));
  firebase.auth().onAuthStateChanged(user=>{
    if(user){try{localStorage.removeItem("contador.guest")}catch(e){}startUser(user)}
    else if(guestMode()){hideLogin();startLocal()}
    else{if(unsubSnap){unsubSnap();unsubSnap=null}col=null;currentUser=null;resetState();render();showLogin()}
  });
}
function loginError(e){
  const c=e&&e.code||"";
  if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request")return "";
  if(c==="auth/unauthorized-domain")return "Este endereço ainda não está liberado no Firebase (Domínios autorizados).";
  if(c==="auth/operation-not-allowed")return "O login com Google ainda não foi ativado no Firebase.";
  if(c==="auth/network-request-failed")return "Sem conexão com a internet. Tente de novo.";
  return "Não foi possível entrar agora. Tente de novo.";
}
function doLogin(){
  if(!fbReady){showLogin("Não foi possível carregar o login. Verifique a internet e recarregue a página.");return}
  const prov=new firebase.auth.GoogleAuthProvider();prov.setCustomParameters({prompt:"select_account"});
  firebase.auth().signInWithPopup(prov).catch(e=>{
    if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")return firebase.auth().signInWithRedirect(prov);
    const m=loginError(e);if(m){if($("#login").hidden){toast(m)}else showLogin(m)}
  });
}

/* ---------- calculations ---------- */
function dayItems(k){return (S.days[k]&&S.days[k].items)||[]}
function sum(items){return items.reduce((a,i)=>({kcal:a.kcal+(+i.kcal||0),p:a.p+(+i.p||0),c:a.c+(+i.c||0),f:a.f+(+i.f||0)}),{kcal:0,p:0,c:0,f:0})}
function status(v,g){
  if(!g) return null;
  const r=v/g;
  if(r>1.1) return {cls:"over",txt:"Passou "+fmtDelta(v-g)};
  if(r>=0.9) return {cls:"ok",txt:"Na meta"};
  return {cls:"",txt:"Faltam "+fmtDelta(g-v)};
}
let _unit="";
function fmtDelta(n){return fmt0(n)+_unit}
function st(v,g,unit){_unit=unit;return status(v,g)}
function allFoods(){const mine=S.settings.foods.map(f=>Object.assign({},f,{builtin:false})),lr=learnedFoods(mine);
  const have=new Set(mine.concat(lr).map(f=>norm(f.name).trim()));return mine.concat(lr,sharedFoods.filter(f=>!have.has(f.n)),BASE)}
/* ---------- base compartilhada: tudo que qualquer pessoa logada já pesquisou fica disponível para todos ---------- */
let sharedFoods=[];
function hashKey(t){let h=5381,h2=52711;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);h=((h<<5)+h+c)|0;h2=((h2<<5)+h2^c)|0}return (h>>>0).toString(36)+(h2>>>0).toString(36)}
function baseCol(){try{return currentUser&&fbReady?firebase.firestore().collection("base"):null}catch(e){return null}}
function loadShared(){
  const c=baseCol();if(!c)return;
  try{c.where("tipo","==","alimento").limit(2000).get().then(q=>{
    const builtin=new Set(BASE.map(f=>norm(f.name).trim()));
    sharedFoods=q.docs.map(d=>d.data()).filter(x=>x&&x.nome&&x.kcal!=null&&x.n&&!builtin.has(x.n)).map(x=>({id:"S-"+x.n,n:x.n,name:x.nome,kcal:+x.kcal,p:+x.p||0,c:+x.c||0,f:+x.f||0,unit:"g",per:100,
      portions:x.medida&&x.g?[[x.medida,x.g]]:[],src:"Base",builtin:true,learned:true,shared:true}));
  }).catch(()=>{})}catch(e){}
}
async function sharedLookup(key){
  const c=baseCol();if(!c)return null;
  try{const d=await Promise.race([c.doc("q_"+hashKey(key)).get(),new Promise((_,j)=>setTimeout(()=>j(new Error("lento")),2500))]);
    const x=d.exists&&d.data();if(x&&x.q===key&&Array.isArray(x.itens)&&x.itens.length)return x}catch(e){}
  return null;
}
function sharedSaveQuery(key,r){const c=baseCol();if(!c||!key)return;c.doc("q_"+hashKey(key)).set({tipo:"busca",q:key,itens:r.itens.slice(0,12),note:String(r.observacao||r.note||"").slice(0,300),t:Date.now()}).catch(()=>{})}
function sharedSaveFoods(its){
  const c=baseCol();if(!c)return;
  its.forEach(x=>{const n=norm(x.name).trim();if(!n)return;const pr=x.per;
    c.doc("f_"+hashKey(n)).set({tipo:"alimento",nome:x.name,n,kcal:pr.kcal,p:pr.p,c:pr.c,f:pr.f,medida:x.medida||"",g:x.g0||null,t:Date.now()}).catch(()=>{});
    if(!sharedFoods.some(f=>f.n===n))sharedFoods.push({id:"S-"+n,n,name:x.name,kcal:pr.kcal,p:pr.p,c:pr.c,f:pr.f,unit:"g",per:100,portions:x.medida&&x.g0?[[x.medida,x.g0]]:[],src:"Base",builtin:true,learned:true,shared:true})});
}
/* alimentos que a pessoa já registrou (inclusive os encontrados na busca inteligente) */
let _habit=null,_habitSig="";
function habitFoods(){
  const keys=Object.keys(S.days).sort().reverse().slice(0,90);
  const sig=keys.length+":"+keys.reduce((a,k)=>a+dayItems(k).length,0)+":"+(keys[0]||"");
  if(_habit&&sig===_habitSig)return _habit;
  const by={};
  keys.forEach((k,di)=>dayItems(k).forEach(it=>{
    const b=it.base;if(!b||b.unit==="porção"||!(+b.per)||!(+it.qty))return;
    const n=norm(it.name).trim();const o=by[n]||(by[n]={name:it.name,n,count:0,meals:{},base:b,qty:it.qty,medida:"",rec:di});
    o.count++;o.meals[it.meal]=(o.meals[it.meal]||0)+1;
    if(di<=o.rec){o.rec=di;o.base=b;o.qty=it.qty;const m=/\(([^)]+)\)\s*$/.exec(it.qtyText||"");o.medida=m?m[1]:""}
  }));
  _habitSig=sig;return _habit=Object.values(by);
}
function learnedFoods(mine){
  const have=new Set(BASE.concat(mine||[]).map(f=>norm(f.name).trim()));
  return habitFoods().filter(h=>!have.has(h.n)).map(h=>({id:"L-"+h.n,name:h.name,kcal:r1(h.base.kcal*100/h.base.per),p:r1(h.base.p*100/h.base.per),c:r1(h.base.c*100/h.base.per),f:r1(h.base.f*100/h.base.per),
    unit:h.base.unit||"g",per:100,portions:h.medida?[[h.medida,Math.round(h.qty)]]:[[fmt0(h.qty)+" g",Math.round(h.qty)]],src:"Aprendido",builtin:true,learned:true}));
}
function habitTop(meal,n){return habitFoods().slice().sort((a,b)=>((b.meals[meal]||0)*3+b.count-b.rec*0.05)-((a.meals[meal]||0)*3+a.count-a.rec*0.05)).slice(0,n)}
function habitItem(h,g){const q=g||Math.round(h.qty),k=100/h.base.per;return {name:h.name,medida:g?"":h.medida,g:String(q),g0:q,on:true,
  per:{kcal:r1(h.base.kcal*k),p:r1(h.base.p*k),c:r1(h.base.c*k),f:r1(h.base.f*k),per:100,unit:h.base.unit||"g"}}}
/* ---------- busca local: alimentos que a pessoa já registrou + base compartilhada ---------- */
const STOPW=new Set(["de","do","da","dos","das","com","e","a","o","um","uma","no","na","em","pra","para","sem"]);
const SPLIT_RE=/\s*(?:,|;|\+|\n|\be\b)\s*/;
function localPool(){
  const pool=habitFoods().slice(),idx={};pool.forEach(h=>idx[h.n]=h);
  sharedFoods.forEach(f=>{if(idx[f.n])return;const p0=f.portions[0];const h={name:f.name,n:f.n,count:0,meals:{},base:{kcal:f.kcal,p:f.p,c:f.c,f:f.f,per:100,unit:"g"},qty:p0?p0[1]:100,medida:p0?p0[0]:"",rec:999};idx[f.n]=h;pool.push(h)});
  return {pool,idx};
}
const wordsOf=s=>norm(s).split(/[^a-z0-9]+/).filter(w=>w&&!STOPW.has(w));
const wHit=(w,x)=>x.startsWith(w)||(w.length>3&&/s$/.test(w)&&x.startsWith(w.slice(0,-1)));
function matchPart(pt,P){
  const k=norm(pt).replace(/\s+/g," ").trim();if(!k)return null;
  const m=/^(\d+(?:[.,]\d+)?)\s*(?:g|gr|gramas?)\b\s*(?:de\s+)?(.*)$/.exec(k);
  let nm=(m?m[2]:k).trim(),mult=1;const q=!m&&/^(\d)\s+(.*)$/.exec(nm);if(q){mult=+q[1]||1;nm=q[2]}
  nm=nm.replace(/^(?:um|uma)\s+/,"");
  let h=P.idx[nm];
  if(!h){const ws=wordsOf(nm).filter(w=>!/^\d/.test(w));if(!ws.length)return null;
    const c=P.pool.filter(x=>{const hw=wordsOf(x.name);return hw.length&&wHit(ws[0],hw[0])&&ws.every(w=>hw.some(y=>wHit(w,y)))});
    if(!c.length)return null;c.sort((a,b)=>(b.count-a.count)||(a.n.length-b.n.length));h=c[0]}
  let g=m?Math.round(num(m[1])):0;if(!g&&mult>1)g=Math.round(h.qty*mult);
  return Object.assign(habitItem(h,g),{fast:true});
}
/* responde na hora o que já é conhecido; devolve em "rest" só o que ainda precisa da busca inteligente */
function iaLocal(text){
  const key=norm(text).replace(/\s+/g," ").trim();if(!key)return {items:[],rest:""};
  const c=(S.settings.iaCache||{})[key];
  if(c&&c.itens&&c.itens.length)return {items:c.itens.map(x=>Object.assign(iaItem(x),{fast:true})),rest:"",note:c.note||""};
  const P=localPool();
  if(P.idx[key])return {items:[Object.assign(habitItem(P.idx[key]),{fast:true})],rest:""};
  const items=[],rest=[];
  text.split(SPLIT_RE).map(x=>x.trim()).filter(Boolean).forEach(pt=>{const it=matchPart(pt,P);if(it)items.push(it);else rest.push(pt)});
  return {items,rest:rest.join(", ")};
}
function iaRemember(text,r){
  const key=norm(text).replace(/\s+/g," ").trim();if(!key||!r||!(r.itens||[]).length)return;
  const c=S.settings.iaCache||(S.settings.iaCache={});
  c[key]={itens:r.itens.slice(0,12),note:String(r.observacao||"").slice(0,300),t:Date.now()};
  const ks=Object.keys(c);if(ks.length>80)ks.sort((a,b)=>c[a].t-c[b].t).slice(0,ks.length-80).forEach(k=>delete c[k]);
  persistSettings();
}

function shortDay(k){const t=todayKey();if(k===t)return "Hoje";if(k===addDays(t,-1))return "Ontem";return cap(fmtDate(k,{weekday:"short",day:"numeric",month:"short"}).replace(/\./g,""))}
function chart(rows,goal){
  const n=rows.length,W=Math.round(Math.min(1032,Math.max(300,(window.innerWidth||640)-(window.innerWidth>760?250:64)))),H=190,T=22,B=26,ih=H-T-B,pad=6;
  const maxV=Math.max(goal?goal*1.2:0,...rows.map(r=>r.t.kcal*1.05),500);

  let tr="",s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de calorias por dia" style="width:100%;height:auto;display:block">`;
  rows.forEach((r,i)=>{

    tr+=`<rect x="${cx-barW/2}" y="${T}" width="${barW}" height="${ih}" rx="${Math.min(10,barW/2)}" fill="var(--surface-2)"/>`;
    if(v>0){s+=`<rect x="${cx-barW/2}" y="${y(v)}" width="${barW}" height="${Math.max(barW*0.6,T+ih-y(v))}" rx="${Math.min(10,barW/2)}" fill="${fill}"><title>${esc(fmtDate(r.k,{day:"numeric",month:"short"}))}: ${fmt0(v)} kcal</title></rect>`;
      if(n<=14) s+=`<text x="${cx}" y="${Math.max(12,y(v)-6)}" text-anchor="middle" font-size="${n>7?10:12}" font-weight="700" fill="var(--muted)" stroke="var(--surface)" stroke-width="4" paint-order="stroke">${fmt0(v)}</text>`;}
    const lab=n<=7?WD[d.getDay()]:(i%(n>14?5:2)===0||i===n-1)?d.getDate()+"/"+(d.getMonth()+1):"";
    if(lab) s+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="12" font-weight="${r.k===todayKey()?800:600}" fill="${r.k===todayKey()?"var(--ink)":"var(--muted)"}">${lab}</text>`;
  });
  if(goal){const gy=y(goal);tr+=`<line x1="${pad}" x2="${W-pad}" y1="${gy}" y2="${gy}" stroke="var(--ok)" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>`}
  return s.replace(/(<svg[^>]*>)/,"$1"+tr)+"</svg>";
}

function weightChart(reg,meta){

const TZ_DOSES=[2.5,5,7.5,10,12.5,15];
const TZ_SITES=[["abd-e","Abdômen esquerdo"],["abd-d","Abdômen direito"],["cox-e","Coxa esquerda"],["cox-d","Coxa direita"],["bra-e","Braço esquerdo"],["bra-d","Braço direito"]];
const TZ_SITE=Object.fromEntries(TZ_SITES);
const TZ_EFF=["Náusea","Vômito","Diarreia","Prisão de ventre","Azia ou refluxo","Cansaço","Dor de cabeça","Pouca fome","Reação no local","Nenhum"];
function tirz(){const t=S.settings.tirz||(S.settings.tirz={});t.doses=t.doses||[];return t}
const dtOf=s=>new Date(s.length<=10?s+"T08:00":s);
function tzState(){
  const t=tirz(),L=t.doses[t.doses.length-1];if(!L)return null;
  const next=keyOf(new Date(dtOf(L.d).getTime()+7*864e5)),diff=Math.round((parseKey(next)-parseKey(todayKey()))/864e5);
  const si=TZ_SITES.findIndex(x=>x[0]===L.local),sug=TZ_SITES[(si+1)%TZ_SITES.length];
  let n=0;for(let i=t.doses.length-1;i>=0&&t.doses[i].mg===L.mg;i--)n++;
  return {t,L,next,diff,sug,nAtDose:n};
}
function tzBanner(){
  const z=tzState();if(!z||z.diff>1)return "";
  const txt=z.diff===1?`Amanhã é dia da tirzepatida (${fmt1(z.L.mg)} mg)`:z.diff===0?`Hoje é dia de aplicar a tirzepatida (${fmt1(z.L.mg)} mg)`:z.diff>=-4?`A tirzepatida está atrasada há ${-z.diff} ${z.diff===-1?"dia":"dias"}`:`A dose da tirzepatida passou há ${-z.diff} dias`;
  return `<button class="card tz-banner ${z.diff<0?"late":""}" data-act="goTz"><span class="e">💉</span><span class="grow"><b>${txt}</b><small>Local sugerido: ${esc(z.sug[1].toLowerCase())} · Toque para registrar</small></span></button>`;
}
function tzLevelAt(doses,ms){const ka=Math.LN2/12,ke=Math.LN2/120;let c=0;doses.forEach(x=>{const h=(ms-dtOf(x.d).getTime())/36e5;if(h>0)c+=x.mg*ka/(ka-ke)*(Math.exp(-ke*h)-Math.exp(-ka*h))});return c}
function tzChart(doses){
  if(!doses.length)return "";
  const now=Date.now(),start=Math.max(dtOf(doses[0].d).getTime()-864e5,now-42*864e5),end=now+7*864e5,step=6*36e5;
  const pts=[];for(let t=start;t<=end;t+=step)pts.push([t,tzLevelAt(doses,t)]);
  const W=Math.round(Math.min(1032,Math.max(300,(window.innerWidth||640)-(window.innerWidth>760?250:64)))),H=150,T=14,B=22;
  const mx=Math.max(1,...pts.map(p=>p[1]))*1.12,x=t=>(t-start)/(end-start)*W,y=v=>T+(1-v/mx)*(H-T-B);
  const past=pts.filter(p=>p[0]<=now),fut=pts.filter(p=>p[0]>=now-step);
  const line=a=>a.map((p,i)=>(i?"L":"M")+x(p[0]).toFixed(1)+" "+y(p[1]).toFixed(1)).join(" ");
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Nível estimado do medicamento" style="width:100%;height:auto;display:block">`;
  s+=`<path d="${line(past)} L${x(now).toFixed(1)} ${H-B} L${x(start)} ${H-B} Z" fill="var(--fat)" opacity=".13"/><path d="${line(past)}" fill="none" stroke="var(--fat)" stroke-width="2.6" stroke-linejoin="round"/>`;
  s+=`<path d="${line(fut)}" fill="none" stroke="var(--fat)" stroke-width="2.2" stroke-dasharray="4 5" opacity=".7"/>`;
  doses.forEach(d=>{const t=dtOf(d.d).getTime();if(t>=start)s+=`<text x="${x(t)}" y="${H-5}" font-size="12" text-anchor="middle">💉</text>`});
  const nv=tzLevelAt(doses,now);s+=`<line x1="${x(now)}" x2="${x(now)}" y1="${T}" y2="${H-B}" stroke="var(--ink)" stroke-width="1.2" opacity=".35"/><circle cx="${x(now)}" cy="${y(nv)}" r="5" fill="var(--fat)"/><text x="${x(now)-8}" y="${y(nv)-9}" font-size="12" font-weight="800" fill="var(--ink)" text-anchor="end" stroke="var(--surface)" stroke-width="4" paint-order="stroke">agora ≈ ${fmt1(nv)} mg</text>`;
  return s+"</svg>";
}

const BIO_PROMPT=`Este arquivo é um laudo de bioimpedância (por exemplo InBody). Extraia TODOS os valores numéricos, sem inventar nada.
- exames: um item por data de exame. Use o exame principal e também cada data das tabelas e gráficos de histórico (ex.: "Histórico da Composição Corporal"). data no formato AAAA-MM-DD (o laudo costuma usar DD.MM.AA).

- Valores em kg, %, L, kcal, como impressos (use ponto como separador decimal). Deixe null o que não aparecer para aquela data.
- massa_magra_* são os valores em kg da "Análise da Massa Magra Segmentar" ou dos gráficos de massa magra segmentar.
- controle_gordura e controle_muscular são os valores de "Controle de Peso" (negativo quando é para perder).
- faixas: as faixas de referência impressas entre parênteses, com indicador igual a um destes nomes: peso, massa_muscular_esqueletica, massa_gordura, percentual_gordura, gordura_visceral, massa_livre_gordura, agua_corporal, proteinas, minerais, imc, taxa_metabolica_basal, relacao_cintura_quadril.`;

  peso_ideal:"pesoIdeal",controle_gordura:"ctrlG",controle_muscular:"ctrlM",massa_magra_braco_direito:"seg_bd",massa_magra_braco_esquerdo:"seg_be",massa_magra_tronco:"seg_tr",massa_magra_perna_direita:"seg_pd",massa_magra_perna_esquerda:"seg_pe"};
function bioParse(r){
  const by={};
  (r.exames||[]).forEach(x=>{let d=String(x.data||"").trim();const m=/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/.exec(d);if(m)d=(m[3].length===2?"20"+m[3]:m[3])+"-"+p2(+m[2])+"-"+p2(+m[1]);
    if(!/^\d{4}-\d\d-\d\d$/.test(d))return;const e=by[d]||(by[d]={d});Object.entries(BIO_MAP).forEach(([a,k])=>{const v=x[a];if(v!=null&&isFinite(+v))e[k]=+v})});
  const ref={};(r.faixas||[]).forEach(f=>{const k=BIO_MAP[f.indicador];if(k&&isFinite(+f.minimo)&&isFinite(+f.maximo)&&+f.maximo>+f.minimo)ref[k]=[+f.minimo,+f.maximo]});

}
function bioImport(file){

  const fr=new FileReader();
  fr.onload=async()=>{
    const url=String(fr.result),mime=file.type||(/\.pdf$/i.test(file.name)?"application/pdf":"image/jpeg");
    ui.bioImp={loading:true};render();
    try{const r=await aiAsk([{text:BIO_PROMPT},{inlineData:{mimeType:mime,data:url.split(",")[1]}}],BIO_SCHEMA);ui.bioImp=bioParse(r)}
    catch(e){console.warn(e);const m=aiErrMsg(e);ui.bioImp={err:m==="setup"?"Não consegui ler o exame agora. Tente de novo em instantes ou digite os valores.":m}}
    if(ui.view==="corpo"&&ui.ct==="bio")render();
  };
  fr.readAsDataURL(file);
}
function bioStore(list,ref,altura){
  const b=bio(),c=corpo(),before=b.ex.slice();
  list.forEach(e=>{const i=b.ex.findIndex(x=>x.d===e.d);if(i>=0)b.ex[i]=Object.assign({},b.ex[i],e);else b.ex.push(e)});
  b.ex.sort((a,b2)=>a.d<b2.d?-1:1);if(ref)Object.assign(b.ref,ref);if(altura&&!c.altura)c.altura=altura;
  list.forEach(e=>{if(e.peso==null)return;const r=c.reg.find(x=>x.d===e.d);if(r){if(r.peso==null)r.peso=e.peso}else c.reg.push({d:e.d,peso:e.peso})});c.reg.sort((a,b2)=>a.d<b2.d?-1:1);
  persistSettings();
  const L=b.ex[b.ex.length-1],P=b.ex.length>1?b.ex[b.ex.length-2]:null,wins=[];
  if(P&&list.some(e=>e.d===L.d)){
    if(L.gord!=null&&P.gord!=null&&L.gord<P.gord)wins.push(`Você perdeu ${fmt1(P.gord-L.gord)} kg de gordura desde ${dmy(P.d)}.`);
    if(L.mme!=null&&P.mme!=null&&L.mme>P.mme)wins.push(`Ganhou ${fmt1(L.mme-P.mme)} kg de massa muscular! 💪`);
    if(L.visc!=null&&P.visc!=null&&L.visc<P.visc)wins.push(`A gordura visceral caiu de ${P.visc} para ${L.visc}.`);
    if(L.pgc!=null&&P.pgc!=null&&L.pgc<P.pgc)wins.push(`O percentual de gordura caiu ${fmt1(P.pgc-L.pgc)} pontos.`);
  }

}

const LM_TIPOS=[["tirz","💉","Tirzepatida"],["med","💊","Remédio"],["alarme","⏰","Despertador"],["refeicao","🍽️","Refeição"],["agua","💧","Água"],["peso","⚖️","Pesagem"]];
const LM_EMO=Object.fromEntries(LM_TIPOS.map(([k,e])=>[k,e]));
const WD=["D","S","T","Q","Q","S","S"],WD_LONG=["domingo","segunda","terça","quarta","quinta","sexta","sábado"],WD_ICS=["SU","MO","TU","WE","TH","FR","SA"];
function lembretes(){return S.settings.lembretes||(S.settings.lembretes=[])}
function lmDays(l){return l.rep==="semana"&&l.dias&&l.dias.length?l.dias:[0,1,2,3,4,5,6]}
function lmDaysTxt(l){const d=lmDays(l);if(d.length===7)return "todo dia";if(d.length===5&&[1,2,3,4,5].every(x=>d.includes(x)))return "segunda a sexta";if(d.length===1)return "toda "+WD_LONG[d[0]];return d.map(x=>WD_LONG[x].slice(0,3)).join(", ")}
function nextOcc(l,from){const now=from||new Date(),[hh,mm]=(l.hora||"08:00").split(":").map(Number),ds=lmDays(l);
  for(let i=0;i<8;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i,hh,mm);if(d>now&&ds.includes(d.getDay()))return d}return null}
function nextReminders(n){const now=new Date(),tk=todayKey();return lembretes().filter(l=>l.ativo!==false).map(l=>({l,d:nextOcc(l,now)})).filter(x=>x.d).sort((a,b)=>a.d-b.d).slice(0,n)
  .map(x=>{const k=keyOf(x.d);return Object.assign(x,{when:(k===tk?"Hoje":k===addDays(tk,1)?"Amanhã":cap(x.d.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".","")))+" "+x.l.hora})})}
const p2=n=>String(n).padStart(2,"0");
const icsDT=d=>d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+"T"+p2(d.getHours())+p2(d.getMinutes())+"00";
function lmRRule(l){const d=lmDays(l);return d.length===7?"FREQ=DAILY":"FREQ=WEEKLY;BYDAY="+d.map(x=>WD_ICS[x]).join(",")}
function gcalLink(l){const d=nextOcc(l)||new Date(),e=new Date(d.getTime()+15*6e4);let tz="America/Sao_Paulo";try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz}catch(_){}
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(LM_EMO[l.tipo]+" "+l.titulo)+"&dates="+icsDT(d)+"/"+icsDT(e)+"&ctz="+encodeURIComponent(tz)+"&recur="+encodeURIComponent("RRULE:"+lmRRule(l))+"&details="+encodeURIComponent("Lembrete do app Contador")}
function icsDownload(l){
  const d=nextOcc(l)||new Date(),now=new Date(),esc2=s=>String(s).replace(/[,;\\]/g,m=>"\\"+m);
  const txt=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Contador//Lembretes//PT","CALSCALE:GREGORIAN","BEGIN:VEVENT","UID:"+l.id+"@contador","DTSTAMP:"+icsDT(now),"DTSTART:"+icsDT(d),"DURATION:PT15M","RRULE:"+lmRRule(l),
    "SUMMARY:"+esc2(LM_EMO[l.tipo]+" "+l.titulo),"DESCRIPTION:Lembrete do app Contador","BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+esc2(l.titulo),"TRIGGER:PT0M","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  const url=URL.createObjectURL(new Blob([txt],{type:"text/calendar"})),a=document.createElement("a");a.href=url;a.download="lembrete-"+norm(l.titulo).replace(/[^a-z0-9]+/g,"-")+".ics";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
}

let swReg=null;
function startReminders(){
  try{if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").then(r=>{swReg=r}).catch(()=>{})}catch(e){}
  setInterval(checkReminders,20000);setTimeout(checkReminders,3000);
}
function checkReminders(){
  const now=new Date(),hm=p2(now.getHours())+":"+p2(now.getMinutes()),tk=todayKey();
  lembretes().forEach(l=>{
    if(l.ativo===false||l.hora!==hm||!lmDays(l).includes(now.getDay()))return;
    const fk="contador.lm."+l.id+"."+tk;try{if(localStorage.getItem(fk))return;localStorage.setItem(fk,"1")}catch(e){}
    fireReminder(l);
  });
}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ac=new C();[0,0.35,0.7,1.4,1.75,2.1].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(0.0001,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(0.3,ac.currentTime+t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+t+0.25);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+0.3)})}catch(e){}}
function fireReminder(l){
  beep();try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(e){}
  const title=LM_EMO[l.tipo]+" "+l.titulo;
  try{if(("Notification" in window)&&Notification.permission==="granted"){if(swReg&&swReg.showNotification)swReg.showNotification(title,{body:"Lembrete das "+l.hora,tag:l.id});else new Notification(title,{body:"Lembrete das "+l.hora,tag:l.id})}}catch(e){}
  let el=document.getElementById("party");if(el)el.remove();
  el=document.createElement("div");el.id="party";el.className="party";
  el.innerHTML=`<div class="party-card lm-alert" role="alertdialog" aria-label="${esc(title)}"><div class="big ring">${LM_EMO[l.tipo]}</div><h2>${esc(l.titulo)}</h2><p class="muted">${esc(l.hora)} · ${esc(lmDaysTxt(l))}</p>
    ${l.tipo==="tirz"?`<button class="btn primary" style="width:100%;margin-top:6px" data-act="lmTirz">💉 Registrar aplicação</button>`:""}
    ${l.tipo==="peso"?`<button class="btn primary" style="width:100%;margin-top:6px" data-act="lmPeso">⚖️ Registrar peso</button>`:""}
    <button class="btn ${l.tipo==="tirz"||l.tipo==="peso"?"":"primary"}" style="width:100%;margin-top:6px" data-act="partyClose">${l.tipo==="med"?"Tomei ✓":"OK"}</button></div>`;
  document.body.appendChild(el);
}

  return list.map(f=>[score(f),f]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
}

async function aiAskKey(key,parts,schema){

    for(let tent=0;tent<2;tent++){
      let r,j;
      try{r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},

async function iaRun(){
  const ia=sh.ia,t=$("#ia-text");if(t)ia.text=t.value;

  if(!kt&&!ia.img){if(t){t.focus();t.style.borderColor="var(--over)"}return}
  ia.err=null;ia.note="";let ask=kt;
  if(!ia.img){const loc=iaLocal(kt);if(loc.items.length)addPlate(loc.items);ask=loc.rest.trim();if(loc.note)ia.note=loc.note;
    if(!ask){ia.text="";drawSheet();return}}
  const me=sh;ia.loading=true;ia.text=ask;drawSheet();
  const qk=norm(ask).replace(/\s+/g," ").trim();
  if(!ia.img&&qk){const x=await sharedLookup(qk);if(x){addPlate(x.itens.map(r=>Object.assign(iaItem(r),{fast:true})));ia.note=x.note||"";ia.loading=false;ia.text="";iaRemember(ask,{itens:x.itens,observacao:x.note});if(sh===me&&sh.tab==="ia")drawSheet();return}}
  const parts=[{text:AI_PROMPT+"\n\nRefeição: "+MEAL_NAME[sh.meal]+"\nDescrição da pessoa: "+(ask||"(sem descrição, use a foto)")}];
  if(ia.img)parts.push({inlineData:{mimeType:"image/jpeg",data:ia.img.split(",")[1]}});
  try{const r=await aiAsk(parts);const its=(r.itens||[]).map(iaItem);addPlate(its);ia.note=r.observacao||"";
    if(its.length){ia.text="";if(!ia.img){iaRemember(ask,r);sharedSaveQuery(qk,r)}}else ia.note=r.observacao||"Não encontrei alimentos. Descreva com mais detalhes ou escolha abaixo."}
  catch(e){console.warn(e);ia.err=aiErrMsg(e);ia.errRaw=String(e&&(e.message||e)).slice(0,400)}
  ia.loading=false;if(sh===me&&sh.tab==="ia")drawSheet();
}
function iaPhoto(file){
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    if(!sh||!sh.ia)return;sh.ia.img=c.toDataURL("image/jpeg",0.82);sh.ia.err=null;drawSheet()};im.onerror=()=>toast("Não consegui abrir essa imagem");im.src=fr.result};
  fr.readAsDataURL(file);
}

function toast(msg,action){
  const t=$("#toast");t.innerHTML=`<span>${esc(msg)}</span>${action?`<button>${esc(action.label)}</button>`:""}`;t.hidden=false;
  if(action) t.querySelector("button").onclick=()=>{t.hidden=true;action.fn()};
  clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},action?5000:2600);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-nav]");if(nav){go(nav.dataset.nav);return}
  const a=e.target.closest("[data-act]");
  if(!a){ if(e.target.id==="sheetWrap") closeSheet(); return }
  const act=a.dataset.act;
  switch(act){
    case "prevDay":ui.date=addDays(ui.date,-1);render();break;
    case "nextDay":ui.date=addDays(ui.date,1);render();break;
    case "today":ui.date=todayKey();render();break;
    case "goDay":ui.date=a.dataset.k;render();break;
    case "add":openAdd(a.dataset.meal);break;
    case "editItem":openEdit(a.dataset.id);break;
    case "delItem":removeItem(a.dataset.id);break;
    case "repeat":{const m=a.dataset.meal;const src=dayItems(addDays(ui.date,-1)).filter(i=>i.meal===m);const d=S.days[ui.date]||(S.days[ui.date]={items:[]});src.forEach(i=>d.items.push(Object.assign({},i,{id:uid().slice(0,16)})));persistDay(ui.date);render();toast(src.length+" itens copiados");break}
    case "range":ui.range=+a.dataset.n;render();break;
    case "openDay":ui.date=a.dataset.k;go("hoje");break;
    case "useMacroK":{const g=S.settings.goals;g.kcal=Math.round((g.p||0)*4+(g.c||0)*4+(g.f||0)*9);persistSettings();render();toast("Meta de calorias atualizada");break}
    case "sumMeals":{const g=S.settings.goals,mg=S.settings.mealGoals;["kcal","p","c","f"].forEach(k=>{let s=0,any=false;MEALS.forEach(([m])=>{const v=(mg[m]||{})[k];if(v!=null){s+=v;any=true}});if(any)g[k]=r1(s)});persistSettings();render();toast("Meta diária atualizada");break}
    case "delFood":{
      if(a.dataset.confirm){S.settings.foods=S.settings.foods.filter(f=>f.id!==a.dataset.id);persistSettings();render();toast("Alimento excluído")}
      else{a.dataset.confirm="1";a.textContent="Confirmar exclusão"}
      break}
    case "export":{
      const data={app:"contador",versao:1,exportadoEm:new Date().toISOString(),settings:S.settings,days:S.days};
      const blob=new Blob([JSON.stringify(data)],{type:"application/json"});const url=URL.createObjectURL(blob);
      const ln=document.createElement("a");ln.href=url;ln.download="contador-backup-"+todayKey()+".json";document.body.appendChild(ln);ln.click();ln.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Backup exportado");break}
    case "account":openAccount();break;
    case "login":doLogin();break;
    case "loginFromGuest":closeSheet();try{localStorage.removeItem("contador.guest")}catch(e){}doLogin();break;
    case "guest":try{localStorage.setItem("contador.guest","1")}catch(e){}hideLogin();startLocal();break;
    case "logout":closeSheet();if(unsubSnap){unsubSnap();unsubSnap=null}col=null;firebase.auth().signOut();toast("Você saiu da conta");break;
    case "shClose":closeSheet();break;
    case "shTab":if(sh.tab==="manual")readMan();sh.tab=a.dataset.t;drawSheet();focusFirst();break;
    case "toManual":sh.man.name=sh.q;sh.tab="manual";drawSheet();break;
    case "pick":{const f=allFoods().concat(sh.off&&sh.off.list||[]).find(x=>x.id===a.dataset.id);if(!f)break;sh.food=f;if(sh.tab==="ia")sh.tab="buscar";const p=f.portions&&f.portions[0];sh.qty=f.unit==="porção"?"1":String(p?p[1]:100);drawSheet();break}
    case "shBack":sh.food=null;drawSheet();focusFirst();break;
    case "offSearch":offSearch();break;
    case "iaRun":iaRun();break;
    case "habit":{const h=habitFoods().find(x=>x.n===a.dataset.n);if(!h||!sh.ia)break;const ia=sh.ia;ia.err=null;ia.res=ia.res||[];
      const i=ia.res.findIndex(x=>norm(x.name).trim()===h.n);if(i>=0)ia.res.splice(i,1);else ia.res.push(Object.assign(habitItem(h),{fast:true}));drawSheet();break}
    case "goTab":{const t=a.dataset.t,txt=(sh.ia&&sh.ia.text||"").trim();if(t==="buscar"){sh.q=txt;sh.food=null}if(t==="manual"&&!sh.man.name)sh.man.name=txt;if(t==="preparo"&&!sh.prep.base)sh.prep.q=txt;sh.tab=t;drawSheet();focusFirst();break}
    case "iaKeySave":{const v=(a.parentElement.querySelector("input").value||"").trim();S.settings.aiKey=v;aiModelName=null;persistSettings();if(v)publishAppKey(v).then(ok=>toast(ok?"Configuração salva e liberada para todos":"Configuração salva"));else toast("Configuração removida");if(sh&&sh.ia&&v&&(sh.ia.text||sh.ia.img))iaRun();else if(sh&&sh.mode==="account")openAccount();else if(sh)drawSheet();break}
    case "iaNoPhoto":sh.ia.img=null;drawSheet();break;
    case "prPick":{const f=allFoods().find(x=>x.id===a.dataset.id);if(!f)break;sh.prep.base=f;drawSheet();break}
    case "prBack":sh.prep.base=null;drawSheet();focusFirst();break;
    case "prMethod":{const op=$("#sheet details.adj");const wasOpen=op&&op.open;applyMethod(sh.prep,a.dataset.k);drawSheet();if(wasOpen)$("#sheet details.adj").open=true;break}
    case "prPortion":sh.prep.qty=a.dataset.g;$("#pr-qty").value=sh.prep.qty;drawPrepOut();break;
    case "rcPick":{const f=allFoods().find(x=>x.id===a.dataset.id);if(!f)break;const p=f.portions&&f.portions[0];sh.rec.ings.push(Object.assign({},f,{g:String(p?p[1]:100)}));sh.rec.q="";drawSheet();const e=$("#rc-g-"+(sh.rec.ings.length-1));if(e){e.focus();e.select()}break}
    case "rcDel":sh.rec.ings.splice(+a.dataset.i,1);drawSheet();break;
    case "rcPortion":sh.rec.qty=a.dataset.g;$("#rc-qty").value=sh.rec.qty;drawRecOut();break;
    case "portion":sh.qty=a.dataset.g;$("#sh-qty").value=sh.qty;drawPreview();break;
    case "shSave":shSave();break;
    case "homeAdd":openMealPick();break;
    case "pickMeal":ui.date=todayKey();closeSheet();openAdd(a.dataset.meal);break;
    case "homeDay":ui.date=todayKey();go("hoje");break;
    case "goMed":ui.ct="medidas";go("corpo");break;
    case "sugPick":{const ia=sh.ia,sg=(ia.sug||[])[+a.dataset.i];if(!sg)break;addPlate([sg.h?Object.assign(habitItem(sg.h),{fast:true}):foodItem(sg.f)]);
      const ps=ia.text.split(/(,|;|\+|\n|\be\b)/);ps.pop();ia.text=ps.join("").replace(/[\s,;+]*(\be\b)?[\s,;+]*$/,"").trim();ia.text=ia.text?ia.text+", ":"";ia.err=null;
      drawSheet();const t=$("#ia-text");if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length)}break}
    case "iaDel":sh.ia.res.splice(+a.dataset.i,1);drawSheet();break;
    case "lmNew":ui.lmd=Object.assign({id:null},lmPreset(a.dataset.k));render();{const e=$("#lm-tit");if(e)e.scrollIntoView({block:"center"})}break;
    case "lmEdit":{const l=lembretes().find(x=>x.id===a.dataset.id);if(l){ui.lmd=JSON.parse(JSON.stringify(l));ui.lmd.dias=ui.lmd.dias||[];render();window.scrollTo(0,0)}break}
    case "lmRep":lmKeep();ui.lmd.rep=a.dataset.v;if(ui.lmd.rep==="semana"&&!ui.lmd.dias.length)ui.lmd.dias=[new Date().getDay()];render();break;
    case "lmDay":{lmKeep();const i=+a.dataset.i,d=ui.lmd.dias,j=d.indexOf(i);if(j>=0)d.splice(j,1);else d.push(i);render();break}
    case "lmSave":lmSave();break;
    case "lmCancel":ui.lmd=null;render();break;
    case "lmIcs":{const l=lembretes().find(x=>x.id===a.dataset.id);if(l){icsDownload(l);toast("Abra o arquivo baixado para colocar na agenda")}break}
    case "lmDel":if(a.dataset.confirm){S.settings.lembretes=lembretes().filter(x=>x.id!==a.dataset.id);persistSettings();render();toast("Lembrete apagado")}else{a.dataset.confirm="1";a.textContent="Apagar?"}break;
    case "lmPerm":try{Notification.requestPermission().then(()=>render())}catch(e){}break;
    case "lmTirz":{const el=document.getElementById("party");if(el)el.remove();ui.ct="tirz";go("corpo");break}
    case "lmPeso":{const el=document.getElementById("party");if(el)el.remove();ui.ct="medidas";go("corpo");break}
    case "ct":ui.ct=a.dataset.t;render();break;
    case "goBio":ui.ct="bio";go("corpo");break;
    case "bioSave":{const st=ui.bioImp;if(!st||!st.ex)break;const w=bioStore(st.ex,st.ref,st.altura);ui.bioImp=null;render();window.scrollTo(0,0);if(w.length)celebrate("Seu exame mostra evolução! 🎉",w);else toast("Exames salvos");break}
    case "bioCancel":ui.bioImp=null;render();break;
    case "bioManual":ui.bioMan={d:todayKey()};render();{const e=$("#bm-d");if(e)e.scrollIntoView({block:"center"})}break;
    case "bioManCancel":ui.bioMan=null;render();break;
    case "bioManSave":{const e={d:$("#bm-d").value||todayKey()};let n=0;BIO_F.forEach(([k])=>{const v=num($("#bm-"+k).value);if(v!=null){e[k]=v;n++}});BIO_SEG.forEach(([k])=>{const v=num($("#bm-seg_"+k).value);if(v!=null){e["seg_"+k]=v;n++}});
      if(!n){toast("Preencha pelo menos um valor");break}ui.bioMan=null;const w=bioStore([e]);render();window.scrollTo(0,0);if(w.length)celebrate("Seu exame mostra evolução! 🎉",w);else toast("Exame salvo");break}
    case "bioDel":if(a.dataset.confirm){const b=bio();b.ex=b.ex.filter(x=>x.d!==a.dataset.d);persistSettings();render();toast("Exame apagado")}else{a.dataset.confirm="1";a.textContent="Apagar mesmo?"}break;
    case "goTz":ui.ct="tirz";go("corpo");break;
    case "corpoSave":corpoSave();break;
    case "cpEdit":ui.cpd=a.dataset.d;render();{const e=$("#cp-peso");if(e){e.scrollIntoView({block:"center"});e.focus()}}break;
    case "cpDel":if(a.dataset.confirm){const c=corpo();c.reg=c.reg.filter(r=>r.d!==a.dataset.d);persistSettings();render();toast("Registro apagado")}else{a.dataset.confirm="1";a.textContent="Apagar?"}break;
    case "partyClose":{const el=document.getElementById("party");if(el)el.remove();break}
    case "tzMg":tzKeep();ui.tzd.mg=+a.dataset.v;render();break;
    case "tzSite":tzKeep();ui.tzd.local=a.dataset.v;render();break;
    case "tzEff":{tzKeep();const e=a.dataset.v,l=ui.tzd.eff;const i=l.indexOf(e);if(i>=0)l.splice(i,1);else{if(e==="Nenhum")l.length=0;else{const j=l.indexOf("Nenhum");if(j>=0)l.splice(j,1)}l.push(e)}render();break}
    case "tzSave":tzSave();break;
    case "tzPen":{const t=tirz();t.restam=a.dataset.v===""?null:+a.dataset.v;persistSettings();render();toast(t.restam==null?"Contagem desligada":"Caneta registrada");break}
    case "tzDel":if(a.dataset.confirm){const t=tirz();t.doses=t.doses.filter(d=>d.id!==a.dataset.id);persistSettings();render();toast("Aplicação apagada")}else{a.dataset.confirm="1";a.textContent="Apagar?"}break;
    case "shDelete":{const id=sh.editId;closeSheet();removeItem(id);break}
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="sh-q"){sh.q=t.value;drawResults()}
  else if(t.id==="sh-qty"){sh.qty=t.value;t.style.borderColor="";drawPreview()}
  else if(t.id==="ia-text"){sh.ia.text=t.value;t.style.borderColor="";drawSug()}
  else if(t.dataset&&t.dataset.iag!=null){sh.ia.res[+t.dataset.iag].g=t.value;iaUpdateRow(+t.dataset.iag)}
  else if(t.dataset&&t.dataset.iaon!=null){sh.ia.res[+t.dataset.iaon].on=t.checked;drawIaOut()}
  else if(t.id==="pr-q"){sh.prep.q=t.value;drawFoodList("#pr-results",t.value,"prPick",f=>f.unit==="g",true)}
  else if(t.id==="pr-qty"){sh.prep.qty=t.value;t.style.borderColor="";drawPrepOut()}
  else if(t.id==="pr-rend"||t.id==="pr-oleo"){sh.prep[t.id.slice(3)]=t.value;drawPrepOut()}
  else if(/^pr-(rosca|ovo|trigo)$/.test(t.id)){sh.prep.emp[t.id.slice(3)]=t.value;drawPrepOut()}
  else if(t.id==="pr-save"){sh.prep.save=t.checked}
  else if(t.id==="rc-name"){sh.rec.name=t.value}
  else if(t.id==="rc-q"){sh.rec.q=t.value;drawFoodList("#rc-results",t.value,"rcPick",f=>f.unit!=="porção",false)}
  else if(t.dataset&&t.dataset.ri!=null){sh.rec.ings[+t.dataset.ri].g=t.value;drawRecOut()}
  else if(t.id==="rc-peso"||t.id==="rc-porc"||t.id==="rc-qty"){sh.rec[t.id.slice(3)]=t.value;$("#rc-err").hidden=true;drawRecOut()}
  else if(t.id==="rc-save"){sh.rec.save=t.checked}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="importFile"&&t.files&&t.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const o=JSON.parse(fr.result);
        if(!o||o.app!=="contador"||typeof o.days!=="object")throw 0;
        const n=Object.values(o.days).filter(d=>d&&d.items&&d.items.length).length;
        if(!window.confirm("Importar o backup com "+n+" dias registrados? Os dados atuais deste aparelho serão substituídos.")){t.value="";return}
        S.settings=Object.assign(defaultSettings(),o.settings||{});S.days=o.days;lsSave();render();toast("Backup importado");
      }catch(e){toast("Esse arquivo não é um backup do Contador.")}
      t.value="";
    };
    fr.readAsText(t.files[0]);return;
  }
  if(t.id==="bio-file"&&t.files&&t.files[0]){bioImport(t.files[0]);t.value="";return}
  if(t.id==="ia-file"&&t.files&&t.files[0]){iaPhoto(t.files[0]);t.value="";return}
  if((t.id==="datePick"||t.id==="datePick2")&&t.value){ui.date=t.value;render();return}
  if(t.dataset.lmon){const l=lembretes().find(x=>x.id===t.dataset.lmon);if(l){l.ativo=t.checked;persistSettings();render();toast(t.checked?"Lembrete ligado":"Lembrete desligado")}return}
  if(t.dataset.cpcfg){const c=corpo(),k=t.dataset.cpcfg;if(k==="sexo")c.sexo=t.value;else{let v=num(t.value);if(k==="altura"&&v&&v<3)v=v*100;c[k]=v||null}persistSettings();render();toast("Dados salvos");return}
  if(t.id==="cp-d"&&t.value){ui.cpd=t.value;render();return}
  if(t.dataset.goal){S.settings.goals[t.dataset.goal]=num(t.value);persistSettings();rerenderKeepFocus();toast("Dieta salva");return}
  if(t.dataset.mg){const m=t.dataset.mg;const o=S.settings.mealGoals[m]=Object.assign({},S.settings.mealGoals[m]);o[t.dataset.k]=num(t.value);persistSettings();rerenderKeepFocus();toast("Dieta salva");return}
});
// re-renderiza depois que o foco já passou para o próximo campo, e devolve o foco a ele
// guarda o que já foi digitado no formulário da tirzepatida antes de redesenhar a tela
function tzKeep(){const d=$("#tz-d"),o=$("#tz-obs");if(ui.tzd){if(d)ui.tzd.d=d.value;if(o)ui.tzd.obs=o.value}}
function rerenderKeepFocus(){
  setTimeout(()=>{
    const a=document.activeElement, id=a&&a.matches&&a.matches("[data-goal],[data-mg]")?a.id:null;
    render();
    if(id){const el=document.getElementById(id);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}}}
  },0);
}
document.addEventListener("submit",e=>{
  if(e.target.id!=="foodForm")return;e.preventDefault();
  const name=$("#nf-name").value.trim(),kcal=num($("#nf-kcal").value);
  if(!name||kcal==null){toast("Preencha o nome e as calorias");return}
  const unit=$("#nf-unit").value;
  S.settings.foods.unshift({id:"u"+uid().slice(0,12),name,unit,per:unit==="porção"?1:100,kcal,p:num($("#nf-p").value)||0,c:num($("#nf-c").value)||0,f:num($("#nf-f").value)||0,portions:[]});
  persistSettings();render();toast("Alimento salvo");
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&sh){closeSheet()}
  if(e.key==="Enter"&&!e.shiftKey&&e.target.id==="ia-text"){e.preventDefault();iaRun();return}
  if(e.key==="Enter"&&sh&&e.target.matches("#sh-qty,#pr-qty,#rc-qty,#sheet .form-grid input")){e.preventDefault();shSave()}
});

render();
initSync();
startReminders();
})();
</script>
